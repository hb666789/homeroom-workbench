<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班主任工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233b6ef6'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E班%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">班</div>
      <div style="flex:1;min-width:0">
        <div class="brand-title">班主任工作台</div>
        <select id="classSelect" class="class-select" onchange="App.switchClass(this.value)" title="切换班级"></select>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-view="dashboard">📊 总览</button>
      <button class="nav-item" data-view="students">👥 学生管理</button>
      <button class="nav-item" data-view="grades">📝 成绩管理</button>
      <button class="nav-item" data-view="analysis">📈 数据分析</button>
      <button class="nav-item" data-view="settings">⚙️ 设置</button>
    </nav>
    <div class="sidebar-foot">数据保存在本浏览器<br>建议定期在「设置」中导出备份</div>
  </aside>
  <main id="main">
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/students.js"></script>
<script src="js/grades.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
